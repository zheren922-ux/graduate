<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毕业快乐 - Blossom</title>
    <style>
        /* 基础重置与唯美背景 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 樱花画布 */
        #sakura-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        /* 初始开启按钮 */
        .start-btn {
            position: relative;
            z-index: 10;
            padding: 15px 40px;
            font-size: 18px;
            color: #d16b8c;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid #ffb3c6;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 179, 198, 0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            letter-spacing: 2px;
        }
        .start-btn:hover {
            background-color: #ffb3c6;
            color: white;
            transform: translateY(-2px);
        }

        /* 核心内容容器 */
        .content-container {
            position: absolute;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
        }

        /* 毕业快乐标题 */
        .title {
            font-size: 3rem;
            color: #c9184a;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease-out 0.5s;
        }

        /* 花束样式 */
        .bouquet {
            font-size: 8rem; /* 如果换成图片，这里改为 width: 200px; */
            margin-bottom: 30px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 1.5s ease-out 1.5s;
            filter: drop-shadow(0 10px 15px rgba(201, 24, 74, 0.2));
        }

        /* 小熊与气泡容器 */
        .bear-section {
            position: relative;
            display: flex;
            align-items: flex-end;
            opacity: 0;
            transform: translateX(-30px);
            transition: all 1.5s ease-out 2.5s;
        }

        /* 小熊样式 */
        .bear {
            font-size: 6rem; /* 如果换成图片，这里改为 width: 120px; */
            animation: float 3s ease-in-out infinite;
        }

        /* 气泡样式 */
        .speech-bubble {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 20px;
            border-bottom-left-radius: 0;
            margin-left: 15px;
            margin-bottom: 40px;
            color: #a01a58;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            position: relative;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -15px;
            border-width: 15px 15px 0 0;
            border-style: solid;
            border-color: transparent rgba(255, 255, 255, 0.9) transparent transparent;
        }

        /* 小熊悬浮动画 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* 激活后的状态类 */
        .active .content-container { opacity: 1; pointer-events: auto; }
        .active .title { opacity: 1; transform: translateY(0); }
        .active .bouquet { opacity: 1; transform: scale(1); }
        .active .bear-section { opacity: 1; transform: translateX(0); }
    </style>
</head>
<body>

    <!-- 背景音乐：建议放入一首像 Serious Bacon 那样带有木吉他扫弦、旋律温柔的泰式轻音乐 -->
    <audio id="bgm" loop>
        <source src="your-soft-music.mp3" type="audio/mpeg">
    </audio>

    <canvas id="sakura-canvas"></canvas>

    <button class="start-btn" id="startBtn">请查收你的毕业礼物</button>

    <div class="content-container" id="content">
        <h1 class="title">毕业快乐</h1>
        <!-- 把这里的 💐 换成 <img src="你的花束图片路径.png" alt="花束"> -->
        <div class="bouquet">💐</div>
        
        <div class="bear-section">
            <!-- 把这里的 🧸 换成 <img src="你的小熊图片路径.png" alt="小熊"> -->
            <div class="bear">🧸</div>
            <div class="speech-bubble">毕业快乐，祝你前程似锦 ✨</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const bgm = document.getElementById('bgm');
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        const content = document.getElementById('content');

        // 设置画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 樱花粒子系统
        const particles = [];
        class Sakura {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 8 + 4; // 花瓣大小
                this.speedY = Math.random() * 1.5 + 0.5; // 下落速度
                this.speedX = Math.random() * 2 - 1; // 飘动幅度
                this.angle = Math.random() * 360; // 旋转角度
                this.spin = Math.random() * 0.05 - 0.025; // 旋转速度
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.angle) * 1.5 + this.speedX;
                this.angle += this.spin;
                
                // 飘出屏幕后重置到顶部
                if (this.y > canvas.height) {
                    this.y = -this.size;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ff8fab';
                
                // 绘制简易的花瓣形状
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size, -this.size, this.size, 0, this.size);
                ctx.bezierCurveTo(this.size, this.size, this.size, -this.size, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        // 初始化樱花
        for (let i = 0; i < 100; i++) {
            particles.push(new Sakura());
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        // 核心交互逻辑
        startBtn.addEventListener('click', () => {
            // 1. 隐藏按钮
            startBtn.style.opacity = '0';
            setTimeout(() => { startBtn.style.display = 'none'; }, 300);

            // 2. 播放柔和的音乐 (如果本地没有音频文件，这里可能会在控制台报错，但不影响画面)
            bgm.volume = 0.5;
            bgm.play().catch(e => console.log("等待本地加入真实的音频文件"));

            // 3. 展现满屏樱花 (Blossom)
            canvas.style.opacity = '1';
            animate();

            // 4. 触发花束、文字、小熊的层叠淡入动画
            document.body.classList.add('active');
        });
    </script>
</body>
</html>
